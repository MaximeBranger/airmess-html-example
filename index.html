<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact – exemple AirMess (HTML)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
    form { display: grid; gap: .5rem; }
    input, textarea, button { font: inherit; padding: .5rem; }
  </style>
</head>
<body>
  <h1>Contact</h1>

  <form id="contact-form" action="https://airmess.fr/f/VOTRE_ID" method="POST">
    <label for="name">Nom</label>
    <input id="name" name="name" type="text" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <button type="submit">Envoyer</button>
    <p id="contact-status" role="status"></p>
  </form>

  <script>
    const form = document.querySelector('#contact-form');
    const status = document.querySelector('#contact-status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      status.textContent = 'Envoi en cours…';

      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form), // si l'API attend du JSON : adapter ici
        });
        if (!res.ok) throw new Error(res.status);
        form.reset();
        status.textContent = 'Merci, votre message a bien été envoyé.';
      } catch {
        status.textContent = "L'envoi a échoué. Réessayez dans un instant.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
